name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies (merkmal pinned to an exact commit)
        env:
          MERKMAL_REQUIRE_UTF8PROC: "1"
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libutf8proc-dev pkg-config
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/ *.py

      - name: Run tests
        run: pytest tests/ -v
